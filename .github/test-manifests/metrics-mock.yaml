apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-mock-config
  namespace: monitoring
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    import time
    
    class MetricsHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == '/metrics':
                self.send_response(200)
                self.send_header('Content-type', 'text/plain')
                self.end_headers()
                
                # Mock metrics that show volumes at different usage levels
                metrics = """# HELP kubelet_volume_stats_available_bytes Number of available bytes in the volume
    # TYPE kubelet_volume_stats_available_bytes gauge
    kubelet_volume_stats_available_bytes{namespace="test-autoscaler",persistentvolumeclaim="test-pvc-1"} 268435456
    kubelet_volume_stats_available_bytes{namespace="test-autoscaler",persistentvolumeclaim="test-pvc-2"} 322122752
    kubelet_volume_stats_available_bytes{namespace="test-autoscaler",persistentvolumeclaim="test-pvc-no-autoscale"} 104857600
    # HELP kubelet_volume_stats_capacity_bytes Capacity in bytes of the volume
    # TYPE kubelet_volume_stats_capacity_bytes gauge
    kubelet_volume_stats_capacity_bytes{namespace="test-autoscaler",persistentvolumeclaim="test-pvc-1"} 1073741824
    kubelet_volume_stats_capacity_bytes{namespace="test-autoscaler",persistentvolumeclaim="test-pvc-2"} 2147483648
    kubelet_volume_stats_capacity_bytes{namespace="test-autoscaler",persistentvolumeclaim="test-pvc-no-autoscale"} 1073741824
    """
                self.wfile.write(metrics.encode())
            else:
                self.send_response(404)
                self.end_headers()
    
    if __name__ == '__main__':
        server = HTTPServer(('0.0.0.0', 8080), MetricsHandler)
        print('Starting metrics mock server on port 8080...')
        server.serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-mock
  namespace: monitoring
  labels:
    app: metrics-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-mock
  template:
    metadata:
      labels:
        app: metrics-mock
    spec:
      containers:
      - name: server
        image: python:3.9-alpine
        command: ["python", "/app/server.py"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /app
      volumes:
      - name: config
        configMap:
          name: metrics-mock-config
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-mock
  namespace: monitoring
  labels:
    app: metrics-mock
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: metrics
  selector:
    app: metrics-mock
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: metrics-mock
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: metrics-mock
  endpoints:
  - port: metrics
    interval: 15s
apiVersion: v1
kind: Namespace
metadata:
  name: test-autoscaler
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc-1
  namespace: test-autoscaler
  labels:
    test: e2e
    volume-autoscaler: "true"
  annotations:
    volume-autoscaler/scale-above-percent: "70"
    volume-autoscaler/scale-up-percent: "150"
    volume-autoscaler/scale-up-max-size: "100Gi"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc-2
  namespace: test-autoscaler
  labels:
    test: e2e
    volume-autoscaler: "true"
  annotations:
    volume-autoscaler/scale-above-percent: "80"
    volume-autoscaler/scale-up-min-increment: "2Gi"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc-no-autoscale
  namespace: test-autoscaler
  labels:
    test: e2e
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
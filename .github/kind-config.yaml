kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraMounts:
  - hostPath: /tmp/kind-data
    containerPath: /var/local-path-provisioner
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
- role: worker
  extraMounts:
  - hostPath: /tmp/kind-data
    containerPath: /var/local-path-provisioner
- role: worker
  extraMounts:
  - hostPath: /tmp/kind-data
    containerPath: /var/local-path-provisioner
featureGates:
  ExpandPersistentVolumes: true
  ExpandInUsePersistentVolumes: true
  ExpandCSIVolumes: true
  CSIStorageCapacity: true